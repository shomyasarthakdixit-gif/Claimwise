version: '3.8'

services:
  claimwise:
    build:
      context: .
      dockerfile: Dockerfile
    image: claimwise:latest
    container_name: claimwise_app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - SECRET_KEY=claimwise-production-secret-key-2026
      - FLASK_ENV=production
    volumes:
      - ./logs:/app/logs
      - ./Output/predictions:/app/Output/predictions
